<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lunar Outpost: Mission Trainer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;600&display=swap">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#070a12;--p1:#0e1424;--p2:#15203b;--br:#2a3f6b;--br2:#4466a8;--acc:#5a8bf0;--cream:#e4ebfa;--mute:#8d9bbd;--bad:#c0483f;--good:#8fb872}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--cream);font:16px/1.5 Barlow,"Segoe UI",system-ui,sans-serif}
h1,h2,.nm{font-family:"Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.04em;margin:0}
h1{font-size:1.7rem;color:var(--acc)}h2{font-size:1.4rem;margin-bottom:6px}
p{margin:0 0 12px;max-width:62ch}
#app{max-width:860px;margin:0 auto;padding:14px}
header{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;margin-bottom:12px}
header span{color:var(--mute)}
.panel{background:linear-gradient(135deg,var(--p1),var(--p2));border:1px solid var(--br);border-left:4px solid var(--acc);border-radius:4px;padding:16px;position:relative}
.slot{background:#0a0f1c center/cover no-repeat;border:1px dashed var(--br2);display:grid;place-items:center;color:var(--mute);font:600 11px/1.3 Barlow,sans-serif;text-align:center;white-space:pre;overflow:hidden}
.slot::before{content:attr(data-k) "\A" attr(data-s)}
.slot.has{border:0}.slot.has::before{content:none}
.sm{width:52px;height:52px}.lg{width:140px;height:140px}.it{width:70px;height:70px;background-color:#0a0f1ccc}
.bg{position:absolute;inset:0;width:100%;height:100%}
.bgf{position:absolute;inset:0;opacity:.6;z-index:0}
.bgf.has{filter:brightness(.85)}
#hud{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.m{background:linear-gradient(135deg,var(--p1),var(--p2));border:1px solid var(--br);padding:8px 10px;border-radius:4px}
.mh{display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:4px}
.bar{height:8px;background:#000;border:1px solid var(--br)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--br2),var(--acc));transition:width .5s}
.bar i.lo{background:linear-gradient(90deg,#6e1f1a,var(--bad))}
#map{position:relative;aspect-ratio:16/9;min-height:330px;border:1px solid var(--br);overflow:hidden}
.hs{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:var(--cream);font:600 .85rem Barlow,sans-serif;cursor:pointer;z-index:1}
.hs span{background:#000b;padding:1px 8px;border:1px solid var(--br)}
.hs:hover .slot,.hs:focus-visible .slot{border-color:var(--acc)}
.hs:focus-visible{outline:2px solid var(--acc)}
.pulse .slot{animation:pl 1.2s infinite}
@keyframes pl{50%{box-shadow:0 0 14px var(--acc);border-color:var(--acc)}}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;color:var(--mute)}
.btn{display:block;width:100%;text-align:left;margin-top:8px;padding:11px 14px;font:600 1rem Barlow,sans-serif;color:var(--cream);border:1px solid var(--br);border-radius:3px;cursor:pointer;background:linear-gradient(90deg,#0c1220,#1d2f57 50%,#0c1220);background-size:200% 100%;transition:background-position .4s,border-color .2s}
.btn:hover{background-position:100% 0;border-color:var(--acc)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.go{text-align:center;width:auto;margin:0;background-image:linear-gradient(90deg,#1c3a85,#3f6fd6 50%,#1c3a85);background-size:200% 100%;color:#f2f6ff;font-weight:700}
.title{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;position:relative}
.title>*{position:relative;z-index:1}.title .bgf{opacity:.5}
#ov{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:#04060dd9;padding:16px;overflow:auto}
#ov.on{display:grid}
#ov .panel{width:min(520px,100%);overflow:hidden}
#ov .panel>*:not(.bgf){position:relative;z-index:1}
.tag{display:inline-block;font:700 .85rem "Barlow Condensed",sans-serif;padding:1px 10px;border:1px solid var(--acc);color:var(--acc);margin-bottom:6px}
.tag.cy{border-color:#c9a0ff;color:#c9a0ff}
.field{position:relative;height:200px;border:1px solid var(--br);background:#0008;margin-bottom:8px}
.deb{position:absolute;width:34px;height:34px;border-radius:40%;border:1px solid var(--br2);background:#5b6478;cursor:pointer}
.tb{height:6px;background:#000;margin:8px 0}.tb i{display:block;height:100%;width:100%;background:var(--acc)}
.tm{min-height:1.5em;font-weight:700;color:var(--acc)}
#sv{width:100%;max-height:230px}.pt{cursor:pointer;stroke:#000;stroke-width:2}
.tank{position:relative;height:190px;width:70px;margin:0 auto 8px;border:2px solid var(--br2);background:#000}
.zone{position:absolute;left:0;right:0;bottom:72%;height:16%;background:#5a8bf044;border-block:2px solid var(--acc)}
.lvl{position:absolute;left:0;right:0;bottom:0;height:0;background:#4f8fbf}
.pots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.pot{height:70px;border:1px solid var(--br);background:#2b3a1f;cursor:pointer;border-radius:4px}
.pot.lit{background:var(--acc)}
#dlg{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;justify-content:flex-end;background:#04060d73;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));cursor:pointer}
#dlg.on{display:flex}
.pt2{width:150px;height:230px;margin:0 0 -8px 8px;position:relative;z-index:1}
.box{max-width:860px;width:100%;margin:0 auto}
.nm{font-size:1.3rem;color:var(--acc)}.role{color:var(--mute);margin-left:8px;font-size:.9rem}
.nx{color:var(--mute);font-size:.8rem;display:block;text-align:right}
#tx{min-height:3em;margin:4px 0}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:40;background:#000e;border:1px solid var(--acc);padding:6px 16px;display:none;white-space:nowrap;font-weight:600}
.ok{color:var(--good)}.no{color:var(--bad)}
ul.log{list-style:none;margin:0 0 12px;padding:0}ul.log li{padding:8px 0;border-top:1px solid var(--br)}
@media (max-width:560px){#hud{grid-template-columns:1fr 1fr}.pt2{width:100px;height:150px}.it{width:54px;height:54px}}
body.calm .pulse .slot{animation:none}body.calm .bar i{transition:none}
h3{font:700 1rem "Barlow Condensed",sans-serif;letter-spacing:.04em;color:var(--mute);margin:12px 0 0}
.btn.sel{border-color:var(--acc);background-position:100% 0;box-shadow:inset 3px 0 var(--acc)}
.hint{float:right;color:var(--mute);font-weight:400}
.crew{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.cc{display:flex;gap:8px;align-items:center;background:linear-gradient(135deg,var(--p1),var(--p2));border:1px solid var(--br);padding:6px;border-radius:4px}
.cc>div{flex:1;min-width:0}.cc small{color:var(--mute)}
@media (max-width:560px){.crew{grid-template-columns:1fr 1fr}}
.sp{position:absolute;transform:translate(-50%,-50%);z-index:2;pointer-events:none;display:flex;flex-direction:column;align-items:center;transition:left .9s ease-in-out,top .9s ease-in-out}
.sp span{font:600 .7rem Barlow,sans-serif;background:#000b;padding:0 5px;border:1px solid var(--br)}
.spr{width:46px;height:46px;font-size:8px;background-color:#0a0f1ccc}
.sp.walk .slot{animation:bob .3s infinite alternate}
.sp.busy .slot{animation:wk .25s infinite alternate}
.sp.rec{opacity:.45}
@keyframes bob{to{transform:translateY(-5px)}}
@keyframes wk{to{transform:rotate(8deg)}}
@media (max-width:560px){.spr{width:36px;height:36px}}
body.calm .sp{transition:none}body.calm .sp .slot{animation:none!important}
.dust{position:absolute;width:0;height:0;z-index:3;pointer-events:none}
.dust.im,.dust.lt{width:130px;height:130px;margin:-65px 0 0 -65px;animation:dfade var(--ms) forwards}
.dsl{width:100%;height:100%}
.dust .pc{position:absolute;left:-130px;top:-110px;width:260px;height:220px}
.dust i{position:absolute;left:0;top:0;animation:ddrift var(--ms) ease-out forwards}
.dust u{display:block;width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);border-radius:50%;background:radial-gradient(circle at 34% 28%,#fff,#e3e9f7 40%,#aab6d4 75%,#7f8db3);box-shadow:inset -3px -4px 0 #3c4b7840;transform:scale(0);animation:dpuff var(--ms) linear var(--dl) forwards,dvanish .35s ease-in calc(var(--ms)*.55) forwards}
@keyframes dfade{0%,78%{opacity:1}100%{opacity:0}}
@keyframes ddrift{0%{transform:translate(0,0)}22%{transform:translate(var(--x),var(--y))}100%{transform:translate(calc(var(--x)*1.12),calc(var(--y) - 18px))}}
@keyframes dpuff{0%{transform:scale(0)}12%{transform:scale(1.18)}20%{transform:scale(1)}40%{transform:scale(.92)}60%{transform:scale(1.08)}80%{transform:scale(.95)}100%{transform:scale(1.02)}}
@keyframes dvanish{to{opacity:0}}
@media (max-width:560px){.dust{transform:scale(.8)}}
body.calm .dust i,body.calm .dust u{animation:none}
body.calm .dust u{transform:scale(1)}
body.calm .dust i{transform:translate(var(--x),var(--y))}
.tg{width:auto;margin:4px 0 0;padding:2px 12px;font-size:.8rem;color:var(--mute)}
.scn{margin:0 0 10px;border:1px solid var(--br);background:#0a0f1c;overflow:hidden}
.scn svg{display:block;width:100%;max-height:130px;margin:0 auto}
.scn .st{stroke:var(--br2);fill:#0e1424;stroke-width:2}
.spin{animation:spin 1.1s linear infinite}
.air{stroke:#8fb0ff;stroke-width:3;stroke-dasharray:6 9;stroke-linecap:round;fill:none;animation:flow .8s linear infinite}
.strm{animation:flow .35s linear infinite}
.wvA{animation:wv 1.7s linear infinite}.wvB{animation:wv 2.6s linear infinite reverse}
.sl2{transform-origin:100px 0;animation:slosh 2.3s ease-in-out infinite alternate}
.bb{animation:bub 2s ease-in infinite}
.pl{animation:sw 2.6s ease-in-out infinite}
.gl{animation:gl 2.4s ease-in-out infinite}
.pw{animation:pw 1s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flow{to{stroke-dashoffset:-30}}
@keyframes wv{to{transform:translateX(-60px)}}
@keyframes slosh{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
@keyframes bub{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-55px);opacity:0}}
@keyframes sw{50%{transform:rotate(5deg)}}
@keyframes gl{from{transform:translateX(-30px)}to{transform:translateX(150px)}}
@keyframes pw{50%{opacity:.35}}
body.calm .scn *{animation:none!important}

/* ===== UI v2 ===== */
body{background:radial-gradient(1100px 520px at 50% -8%,#16264f66,transparent 62%),#05070d}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(#5a8bf012 1px,transparent 1px),linear-gradient(90deg,#5a8bf012 1px,transparent 1px);background-size:46px 46px;animation:grid 34s linear infinite;-webkit-mask-image:radial-gradient(circle at 50% 25%,#000 15%,transparent 75%);mask-image:radial-gradient(circle at 50% 25%,#000 15%,transparent 75%)}
@keyframes grid{to{background-position:46px 46px}}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-track{background:#070a12}::-webkit-scrollbar-thumb{background:linear-gradient(#2f4a86,#4466a8);border:2px solid #070a12}
h1{text-shadow:0 0 22px #5a8bf099;letter-spacing:.16em;text-transform:uppercase}
header{gap:6px}
.dy{font:700 .95rem "Barlow Condensed",sans-serif;letter-spacing:.3em;color:var(--mute)}
.days{display:flex;gap:5px}.days i{width:24px;height:5px;background:#1d2f57;transform:skewX(-25deg)}
.days i.done{background:var(--acc)}.days i.now{background:#cfe2ff;box-shadow:0 0 10px var(--acc);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.45}}
.btn,.g,.wp,.cc{clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.btn:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--acc)}
.btn.go{box-shadow:0 0 22px #3f6fd677;text-transform:uppercase;letter-spacing:.08em}
#hud{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
.g{position:relative;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;padding:10px 12px 10px 14px;background:linear-gradient(135deg,#0e1424,#16233f);border:1px solid var(--br)}
.g::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc);box-shadow:0 0 12px var(--acc)}
.ic{width:26px;height:26px;fill:none;stroke:var(--acc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px var(--acc))}
.gt{position:relative;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.gt span{font:700 .85rem "Barlow Condensed",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.gt b{font:700 1.8rem/1 "Barlow Condensed",sans-serif;color:var(--cream);text-shadow:0 0 12px #5a8bf099}
.dl{position:absolute;right:46px;top:2px;font:700 1rem "Barlow Condensed",sans-serif;font-style:normal;animation:dlt 1.7s ease-out forwards;pointer-events:none}
.dl.up{color:#7fe0a0}.dl.dn{color:#ff8080}
@keyframes dlt{from{opacity:1;transform:translateY(4px)}to{opacity:0;transform:translateY(-14px)}}
.seg{grid-column:1/-1;display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.seg i{height:10px;background:#0a0f1c;border:1px solid #1d2f57;transform:skewX(-20deg)}
.seg i.on{background:linear-gradient(180deg,#b5d3ff,var(--acc));border-color:var(--acc);box-shadow:0 0 8px #5a8bf088}
.g.md .seg i.on{background:linear-gradient(180deg,#ffe0a8,#e0a43a);border-color:#e0a43a;box-shadow:0 0 8px #e0a43a77}
.g.md::before{background:#e0a43a;box-shadow:0 0 12px #e0a43a}.g.md .ic{stroke:#e0a43a;filter:drop-shadow(0 0 6px #e0a43a)}
.g.lo{animation:alarm 1s ease-in-out infinite}
.g.lo .seg i.on{background:linear-gradient(180deg,#ffb0a8,var(--bad));border-color:var(--bad);box-shadow:0 0 8px #c0483faa}
.g.lo::before{background:var(--bad);box-shadow:0 0 14px var(--bad)}.g.lo .ic{stroke:var(--bad);filter:drop-shadow(0 0 6px var(--bad))}.g.lo .gt b{color:#ffb0a8}
@keyframes alarm{50%{box-shadow:inset 0 0 26px #c0483f66}}
#who{display:flex;gap:10px;margin-bottom:12px}
.wp{flex:1;display:flex;align-items:center;gap:14px;padding:8px 16px;background:linear-gradient(135deg,#0e1424,#16233f);border:1px solid var(--br)}
.wp span{font:700 .85rem "Barlow Condensed",sans-serif;letter-spacing:.16em;color:var(--mute)}
.wp b{margin-left:auto;font:700 1.3rem "Barlow Condensed",sans-serif}
.pips{display:flex;gap:10px;align-items:center}
.dm{width:14px;height:14px;transform:rotate(45deg);border:2px solid var(--br2);background:#0a0f1c}
.dm.rdy{background:var(--acc);border-color:#bfd6ff;box-shadow:0 0 10px var(--acc)}.dm.used{background:#1d2f57}.dm.rec{background:var(--bad);border-color:#ffb0a8;box-shadow:0 0 10px var(--bad)}
.bl{width:16px;height:24px;background:#1d2f57;clip-path:polygon(62% 0,12% 56%,46% 56%,34% 100%,92% 38%,56% 38%)}.bl.rdy{background:linear-gradient(#fff,#8fb8ff)}
#map{border-color:var(--br2);box-shadow:0 0 36px #3f6fd633,inset 0 0 60px #05070dcc}
#map::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:repeating-linear-gradient(transparent 0 3px,#0003 3px 4px),linear-gradient(transparent,#5a8bf01c,transparent) 0 -140px/100% 140px no-repeat;animation:scan 6s linear infinite}
@keyframes scan{to{background-position:0 0,0 760px}}
#map::after{content:"";position:absolute;inset:8px;z-index:4;pointer-events:none;background:linear-gradient(var(--acc),var(--acc)) 0 0/26px 2px,linear-gradient(var(--acc),var(--acc)) 0 0/2px 26px,linear-gradient(var(--acc),var(--acc)) 100% 0/26px 2px,linear-gradient(var(--acc),var(--acc)) 100% 0/2px 26px,linear-gradient(var(--acc),var(--acc)) 0 100%/26px 2px,linear-gradient(var(--acc),var(--acc)) 0 100%/2px 26px,linear-gradient(var(--acc),var(--acc)) 100% 100%/26px 2px,linear-gradient(var(--acc),var(--acc)) 100% 100%/2px 26px;background-repeat:no-repeat}
.hs .slot{transition:transform .2s,box-shadow .2s,border-color .2s}
.hs:not(.pulse) .slot{animation:flt 3.4s ease-in-out infinite}
@keyframes flt{50%{transform:translateY(-3px)}}
.hs:hover .slot{transform:translateY(-5px) scale(1.07);box-shadow:0 0 24px #5a8bf0aa;border-color:var(--acc)}
.hs span{border-left:3px solid var(--acc);font:700 .85rem "Barlow Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase}
.crew{grid-template-columns:repeat(2,1fr);gap:10px}
.cc{gap:12px;padding:10px 12px;border:1px solid var(--br);background:linear-gradient(135deg,#0e1424,#16233f)}
.cc .slot{width:68px;height:68px;flex:none}
.cc.rdy{border-color:var(--br2)}.cc.used{opacity:.78}.cc.rec{border-color:var(--bad)}
.ci{flex:1;min-width:0}
.cn{display:flex;justify-content:space-between;align-items:baseline}
.cn b{font:700 1.15rem "Barlow Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase}
.cn em{font:700 .72rem "Barlow Condensed",sans-serif;font-style:normal;letter-spacing:.14em;color:var(--acc)}
.cc.rec em{color:var(--bad)}.cc.used em{color:var(--mute)}
.seg.hp{margin:4px 0 6px;gap:2px}.seg.hp i{height:6px}
.seg.hp i.on{background:linear-gradient(180deg,#c9f2d2,#58b368);border-color:#58b368;box-shadow:0 0 6px #58b36888}
.cc.rec .seg.hp i.on{background:linear-gradient(180deg,#ffb0a8,var(--bad));border-color:var(--bad)}
.sk{display:grid;grid-template-columns:1fr 1fr;gap:3px 14px;font:700 .7rem "Barlow Condensed",sans-serif;letter-spacing:.12em;color:var(--mute)}
.sk span{display:flex;justify-content:space-between;align-items:center}
.sk u{display:block;width:46px;height:6px;background:repeating-linear-gradient(90deg,#1d2f57 0 7px,transparent 7px 9px);text-decoration:none}
.sk u::after{content:"";display:block;height:100%;width:calc(var(--n)*9px);background:repeating-linear-gradient(90deg,var(--acc) 0 7px,transparent 7px 9px)}
.foot .btn.go{padding:12px 30px;font-size:1.1rem}
#ov.on .panel{animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}}
.box{box-shadow:0 0 34px #5a8bf033}
#toast{box-shadow:0 0 20px #5a8bf077;letter-spacing:.04em}
.title h1{font-size:3rem;letter-spacing:.24em;text-shadow:0 0 34px var(--acc)}
.title .lg{animation:flt 4s ease-in-out infinite}
@media (max-width:760px){#hud{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.crew{grid-template-columns:1fr}#who{flex-direction:column}.title h1{font-size:2rem}}
body.calm .g,body.calm .days i,body.calm #map::before,body.calm body::before,body.calm .dl,body.calm .hs .slot,body.calm .title .lg,body.calm #ov .panel{animation:none!important}
body.calm::before{animation:none}

/* ===== motion pack ===== */
.btn{position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,#ffffff2e,transparent);transform:skewX(-20deg);transition:left .55s}
.btn:hover::after{left:130%}.btn:active{transform:scale(.98)}
.seg i.nw{animation:segin .4s ease-out backwards;animation-delay:calc(var(--i)*40ms)}
@keyframes segin{from{transform:skewX(-20deg) scaleY(.2);opacity:0;filter:brightness(3)}}
.mt{position:absolute;width:3px;height:3px;border-radius:50%;background:#cfe2ff;opacity:0;z-index:1;pointer-events:none;animation:mote 9s linear infinite}
@keyframes mote{0%{opacity:0;transform:translate(0,10px)}20%{opacity:.7}100%{opacity:0;transform:translate(24px,-70px)}}
.hs::before{content:"";position:absolute;left:50%;top:35px;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;border:2px solid var(--acc);opacity:0;animation:ring 3.2s ease-out infinite;pointer-events:none}
.hs:nth-of-type(2)::before{animation-delay:.6s}.hs:nth-of-type(3)::before{animation-delay:1.2s}.hs:nth-of-type(4)::before{animation-delay:1.8s}.hs:nth-of-type(5)::before{animation-delay:2.4s}
@keyframes ring{0%{opacity:.7;transform:scale(.7)}100%{opacity:0;transform:scale(1.8)}}
.hs:active .slot{transform:scale(.94)}
.hs.warn:not(.pulse) .slot{border-color:var(--bad);animation:flick .5s steps(2) infinite}

  s.kn[k][w]=fit(m.b[w]);
  if(r<p){if(w==="s"){apply({[m.r]:12});s.stab[k]=Math.min(3,s.stab[k]+1);t="hardened the system. "+NAME[m.r]+" +12, stability up."}else{apply({[m.r]:GOOD});t="did great work. "+NAME[m.r]+" +"+GOOD+"."}}
  else if(r<p+.25){apply({[m.r]:10});t="finished the job. "+NAME[m.r]+" +10."}
  else{c.hp=Math.max(0,c.hp-18);s.stab[k]--;t="made a mistake and took 18 damage. Stability down."}
  toast(c.n+" "+t);flash(r<p?"ok":r<p+.25?"":"bad");
  if(s.stab[k]<=0){apply({[m.r]:-20});s.crew.forEach(x=>x.hp=Math.max(0,x.hp-10));s.stab[k]=2;flash("bad");q.push(["orbit","Warning: "+m.n+" is malfunctioning! "+NAME[m.r]+" −20 and every crew member took 10 damage."])}
  const d=dead();if(d)return end(false,d);render();if(q.length)say(q)},1500)}
const PE=2;
const SK={oxygen:{n:"Clear the filter",h:"Click every piece of trash before the timer runs out."},power:{n:"Reconnect the cables",h:"Link each wire to the socket with the same color before time runs out."},water:{n:"Fill the water tank",h:"Hold the button to fill the tank. Let go when the level sits in the bright band."},food:{n:"Water the plants",h:"Watch the pots light up, then tap them in the same order."}};
const lvl=()=>Math.min(4,2+Math.floor((s.day-1)/3));
function handson(k){if(s.en<=0)return toast("You’re out of energy for today.");cur=ok=>handDone(k,ok);closeModal();DRILL[k](lvl())}
function handDone(k,ok){closeModal();s.en--;s.busy=1;const m=MD[k];dust(m.x,m.y,1300);flash(ok?"ok":"");
 setTimeout(()=>{s.busy=0;const g=ok?GOOD:8;apply({[m.r]:g});toast("You "+(ok?"nailed it. ":"struggled. ")+NAME[m.r]+" +"+g);render();
  if(!s.fs){s.fs=1;say([["juno",ok?"Hands-on work pays off. But you only have so much energy each day, so use the crew too.":"Hands-on work is tricky. Even a fumble helps a little."]])}},1300)}
function drill(w,body,timed){fl=0;modal(`<div class="panel">${slot("bg."+w,"bgf")}<h2>${SK[w].n}</h2><p>${SK[w].h}</p>${SCN[w]?'<div class="scn">'+SCN[w]+"</div>":""}${body}<div class="tb"${timed?"":" hidden"}><i id="tbar"></i></div><p id="tm" class="tm"></p><button class="btn" onclick="closeModal()">Leave (no energy used)</button></div>`)}
function timer(sec){let t=0;T.push(setInterval(()=>{t+=.1;$("tbar").style.width=100-t/sec*100+"%";if(t>=sec)fin(false)},100))}
function fin(ok){if(fl)return;fl=1;clr();flash(ok?"ok":"bad");$("tm").textContent=ok?"✔ Passed":"✖ Not this time";setTimeout(()=>cur(ok),900)}
const TANK='<div class="scn tk"><svg viewBox="0 0 200 190" role="img" aria-label="Water tank filling"><defs><clipPath id="tc"><rect x="62" y="42" width="76" height="126" rx="5"/></clipPath><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6aa8ff"/><stop offset="1" stop-color="#2a5ea8"/></linearGradient></defs><rect x="14" y="8" width="100" height="14" rx="3" fill="#18233f" stroke="#4466a8"/><rect x="92" y="22" width="16" height="14" fill="#18233f" stroke="#4466a8"/><g clip-path="url(#tc)"><g id="wt" style="transform:translateY(168px);transition:transform .08s linear"><g class="sl2"><g class="wvA"><path d="M-58 0q15-7 30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0V150H-58Z" fill="url(#wg)"/></g><g class="wvB"><path d="M-58 4q15 6 30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0V150H-58Z" fill="#9fc8ff" opacity=".35"/></g><circle class="bb" cx="80" cy="70" r="3" fill="#cfe2ff"/><circle class="bb" style="animation-delay:.7s" cx="102" cy="85" r="2.5" fill="#cfe2ff"/><circle class="bb" style="animation-delay:1.3s" cx="122" cy="75" r="3.5" fill="#cfe2ff"/></g></g></g><rect x="60" y="40" width="80" height="130" rx="7" fill="none" stroke="#8fb0ff" stroke-width="3"/><rect x="58" y="57" width="84" height="20" fill="#5a8bf033" stroke="#8fb0ff" stroke-dasharray="4 3"/><line id="st" class="strm" x1="100" y1="36" x2="100" y2="168" stroke="#8fc0ff" stroke-width="4" stroke-dasharray="5 5" opacity="0"/></svg></div>';
const SCN={
oxygen:'<svg viewBox="0 0 300 110" role="img" aria-label="Life support filter"><rect class="st" x="90" y="10" width="120" height="90" rx="8"/><circle class="st" cx="150" cy="55" r="36"/><g class="spin" style="transform-origin:150px 55px"><g fill="#8fb0ff"><ellipse cx="150" cy="33" rx="7" ry="16"/><ellipse cx="150" cy="33" rx="7" ry="16" transform="rotate(120 150 55)"/><ellipse cx="150" cy="33" rx="7" ry="16" transform="rotate(240 150 55)"/></g></g><circle cx="150" cy="55" r="6" fill="#4466a8"/><path class="air" d="M10 38H88M10 55H88M10 72H88" style="stroke:#a49a82"/><path class="air" d="M212 38H290M212 55H290M212 72H290" style="animation-duration:.6s"/></svg>',
power:'<svg viewBox="0 0 300 110" role="img" aria-label="Solar power bay"><defs><clipPath id="pc"><path d="M90 20H200L215 72H75Z"/></clipPath></defs><g class="spin" style="transform-origin:40px 34px;animation-duration:8s"><path d="M40 8V16M40 52V60M14 34H22M58 34H66M22 16l6 6M52 46l6 6M58 16l-6 6M28 46l-6 6" stroke="#ffd76a" stroke-width="3" stroke-linecap="round"/></g><circle cx="40" cy="34" r="12" fill="#ffd76a"/><path d="M90 20H200L215 72H75Z" fill="#14305e" stroke="#4466a8" stroke-width="2"/><path d="M108 20L98 72M145 20V72M182 20L192 72M82 46H208" stroke="#4466a8"/><g clip-path="url(#pc)"><g class="gl"><rect x="85" y="15" width="16" height="64" fill="#fff" opacity=".25" transform="skewX(-18)"/></g></g><path class="air" d="M215 60H252V88" style="stroke:#ffd76a"/><rect x="238" y="88" width="30" height="16" rx="3" fill="#18233f" stroke="#4466a8"/><rect class="pw" x="241" y="91" width="24" height="10" fill="#5a8bf0"/></svg>',
food:'<svg viewBox="0 0 300 110" role="img" aria-label="Greenhouse"><path d="M30 100V62Q30 12 150 12Q270 12 270 62V100Z" fill="#5a8bf00f" stroke="#4466a8" stroke-width="2"/><path d="M110 12L90 100H130ZM190 12L170 100H210Z" fill="#fff" opacity=".05"/>'+[70,120,180,230].map((x,i)=>'<g class="pl" style="transform-origin:'+x+'px 100px;animation-delay:'+i*.4+'s"><path d="M'+x+' 100V'+(80-i%2*8)+'" stroke="#6bbf59" stroke-width="3"/><ellipse cx="'+(x-9)+'" cy="'+(78-i%2*8)+'" rx="9" ry="5" fill="#6bbf59"/><ellipse cx="'+(x+9)+'" cy="'+(74-i%2*8)+'" rx="9" ry="5" fill="#8fd16f"/></g><rect x="'+(x-15)+'" y="100" width="30" height="8" fill="#3a2f26"/>').join("")+'</svg>'};
function fillTo(v){const y=168-Math.min(v,100)*1.26;$("wt").style.transform="translateY("+y+"px)";$("st").setAttribute("y2",y)}
const TRASH=['<svg viewBox="0 0 40 40"><rect x="12" y="8" width="16" height="26" rx="3" fill="#c0483f" stroke="#111" stroke-width="2"/><rect x="12" y="15" width="16" height="6" fill="#e4ebfa"/><ellipse cx="20" cy="8" rx="8" ry="2.5" fill="#cfd6e6" stroke="#111" stroke-width="2"/></svg>','<svg viewBox="0 0 40 40"><path d="M8 22L12 10L20 6L30 10L34 20L28 32L16 34Z" fill="#e4ebfa" stroke="#111" stroke-width="2"/><path d="M14 14L22 20L18 28M24 12L28 22" stroke="#9aa8c9" fill="none"/></svg>','<svg viewBox="0 0 40 40"><rect x="16" y="3" width="8" height="8" fill="#9fc8ff" stroke="#111" stroke-width="2"/><path d="M12 13Q20 9 28 13V34Q20 38 12 34Z" fill="#5a8bf0" stroke="#111" stroke-width="2"/></svg>','<svg viewBox="0 0 40 40"><path d="M6 20Q10 34 30 32Q36 26 34 12Q28 24 14 22Q10 20 6 20Z" fill="#f2cf4a" stroke="#111" stroke-width="2"/></svg>','<svg viewBox="0 0 40 40"><path d="M6 28L10 16L20 10L32 14L36 26L24 34Z" fill="#7f8db3" stroke="#111" stroke-width="2"/><circle cx="18" cy="22" r="3" fill="#5b6478"/></svg>','<svg viewBox="0 0 40 40"><rect x="7" y="12" width="24" height="16" rx="3" fill="#3f8f4a" stroke="#111" stroke-width="2"/><rect x="31" y="17" width="4" height="6" fill="#aab6d4" stroke="#111" stroke-width="1.5"/></svg>'];
const POT='<svg viewBox="0 0 60 70"><path d="M16 44h28l-4 22H20z" fill="#b5653a" stroke="#111" stroke-width="2"/><rect x="14" y="40" width="32" height="7" rx="2" fill="#c97a4a" stroke="#111" stroke-width="2"/><g class="pf"><path d="M30 40V22" stroke="#3f8f4a" stroke-width="3"/><path d="M30 28Q18 24 16 14Q28 14 30 28Z" fill="#6bbf59" stroke="#111" stroke-width="1.5"/><path d="M30 24Q42 20 44 10Q32 10 30 24Z" fill="#8fd16f" stroke="#111" stroke-width="1.5"/></g></svg>';
const DRILL={
oxygen(L){drill("oxygen",'<div class="field" id="fd"></div>',1);let n=L+5;
 for(let i=0;i<n;i++){const b=document.createElement("button");b.className="deb";b.innerHTML=TRASH[i%TRASH.length];b.style.transform="rotate("+((Math.random()*80-40)|0)+"deg)";b.setAttribute("aria-label","Trash");b.style.left=5+Math.random()*85+"%";b.style.top=5+Math.random()*80+"%";b.onclick=()=>{b.remove();if(--n===0)fin(true)};$("fd").append(b)}timer(11-L)},
power(L){const C=["#d8453d","#3f7fe0","#e8c13a","#58b368"],P=shuf([0,1,2,3]);
 drill("power",'<svg id="sv" viewBox="0 0 300 220">'+C.map((c,i)=>'<g class="pt" data-l="'+i+'"><rect x="8" y="'+(16+i*52)+'" width="44" height="28" rx="6" fill="'+c+'" stroke="#111" stroke-width="3"/><rect x="52" y="'+(24+i*52)+'" width="12" height="12" fill="#cfd6e6" stroke="#111" stroke-width="2"/><rect x="0" y="'+(25+i*52)+'" width="10" height="10" fill="'+c+'"/></g>').join("")+P.map((c,j)=>'<g class="pt" data-r="'+j+'"><rect x="236" y="'+(16+j*52)+'" width="56" height="28" rx="6" fill="#1d2f57" stroke="#111" stroke-width="3"/><rect x="236" y="'+(24+j*52)+'" width="14" height="12" fill="'+C[c]+'" stroke="#111" stroke-width="2"/><rect x="260" y="'+(21+j*52)+'" width="26" height="18" rx="4" fill="'+C[c]+'" stroke="#111" stroke-width="2"/></g>').join("")+"</svg>",1);
 let sel=-1,n=0;const sv=$("sv");
 sv.querySelectorAll("[data-l]").forEach(e=>e.onclick=()=>sel=+e.dataset.l);
 sv.querySelectorAll("[data-r]").forEach(e=>e.onclick=()=>{const j=+e.dataset.r;if(sel>=0&&P[j]===sel){sv.insertAdjacentHTML("afterbegin",'<line x1="64" y1="'+(30+sel*52)+'" x2="236" y2="'+(30+j*52)+'" stroke="'+C[sel]+'" stroke-width="8" stroke-linecap="round"/>');if(++n===4)fin(true)}sel=-1});timer(20-2*L)},
water(L){drill("water",TANK+'<button class="btn go" id="hd" style="width:100%">Hold to fill</button>');
 let v=0,on=0;const hd=$("hd"),stop=()=>{if(!on)return;on=0;clr();$("st").style.opacity=0;fin(v>=72&&v<=88)};
 hd.onpointerdown=e=>{e.preventDefault();if(on||fl)return;on=1;$("st").style.opacity=1;T.push(setInterval(()=>{v+=1.1+.15*(L-2);fillTo(v);if(v>=100)stop()},30))};
 hd.onpointerup=stop;hd.onpointerleave=stop},
food(L){drill("food",'<div class="pots" id="pt">'+[0,1,2,3].map(i=>'<button class="pot" aria-label="Pot '+(i+1)+'">'+POT+'</button>').join("")+"</div>");
 const n=L+2,q=[...Array(n)].map(()=>Math.floor(Math.random()*4)),pots=[...$("pt").children];let pos=0,lock=1;
 const lit=i=>{pots[i].classList.add("lit");setTimeout(()=>pots[i].classList.remove("lit"),320)};
 $("tm").textContent="Watch…";q.forEach((p,i)=>T.push(setTimeout(()=>lit(p),700+i*650)));
 T.push(setTimeout(()=>{lock=0;$("tm").textContent="Your turn"},700+n*650));
 pots.forEach((p,j)=>p.onclick=()=>{if(lock)return;lit(j);if(j!==q[pos])fin(false);else if(++pos===n)fin(true)})}};
function incident(){if(!s.ev)return say([["orbit","No open alerts. All quiet on the comms line."]]);
 const ev=s.ev;modal('<div class="panel">'+slot("bg.comms","bgf")+'<span class="tag'+(ev.s?" cy":"")+'">'+(ev.s?"Cyber alert":"Incident")+"</span><h2>"+ev.n+"</h2><p>"+ev.t+"</p>"+ev.c.map((c,i)=>'<button class="btn" onclick="resolve('+i+')">'+c.l+"</button>").join("")+'<button class="btn" onclick="closeModal()">Not yet</button></div>')}
function resolve(i){const ev=s.ev,c=ev.c[i];closeModal();apply(c.e);s.ev=null;
 if(ev.s){if(c.ok)s.ok++;s.log.push({n:ev.n,ok:c.ok,s:ev.s})}
 if(Object.keys(c.e).length)toast(fx(c.e));flash(ev.s?(c.ok?"ok":"bad"):"");const d=dead();if(d)return end(false,d);render();
 say(ev.s?[["orbit",c.m],["orbit",(c.ok?"Well handled. ":"That one goes in the log. ")+"Security tip: "+ev.s]]:[["vega",c.m]])}
function endDay(){if(s.busy)return;if(s.ev)return say([["vega","There’s still an open alert at the comms console. Handle it before you rest."]]);
 s.busy=1;s.crew.forEach((c,i)=>{c.pos=HOME[i];const e=$("sp"+i);if(e){e.classList.add("walk");e.style.left=HOME[i][0]+"%";e.style.top=HOME[i][1]+"%"}});
 setTimeout(()=>{banner("NIGHT","Systems are draining…");setTimeout(()=>{
  apply({o:-DRAIN.o,p:-DRAIN.p,w:-DRAIN.w,f:-DRAIN.f});s.crew.forEach(c=>{c.hp=Math.min(100,c.hp+20);c.used=0});s.en=PE;
  const d=dead();if(d){s.busy=0;bannerOff();return end(false,d)}if(s.day>=DAYS){s.busy=0;bannerOff();return end(true,"")}
  s.day++;s.ev=s.order[s.day-1];banner("DAY "+s.day,"Alert incoming");
  setTimeout(()=>{s.busy=0;bannerOff();render();say([["orbit","Alert for day "+s.day+": "+s.ev.n+". Check the comms console when you’re ready."]])},1100)},1300)},1000)}
function end(w,why){closeModal();s.sc="over";s.win=w;s.why=why;render();if(w)confetti();else flash("bad")}
start();
</script>
